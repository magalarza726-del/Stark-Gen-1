name: Build and publish Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Stark-Gen1-AirBoard-Draw-v1.0.0.apk
          sha256sum dist/Stark-Gen1-AirBoard-Draw-v1.0.0.apk > dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stark-Gen1-AirBoard-Draw-v1.0.0
          path: |
            dist/Stark-Gen1-AirBoard-Draw-v1.0.0.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Stark-Gen1-AirBoard-Draw-v1.0.0.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/Stark-Gen1-AirBoard-Draw-v1.0.0.apk dist/SHA256SUMS.txt               --title "Stark Gen 1 – AirBoard Draw v1.0.0"               --notes "Reinicio total de Gen 1: seguimiento dedicado de tapa azul sobre fondo blanco/uniforme, calibración simple, reenfoque táctil y modo de dibujo mínimo."
          fi
